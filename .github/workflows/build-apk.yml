name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate Gradle Wrapper JAR
      run: |
        echo "Validating gradle/wrapper/gradle-wrapper.jar integrity..."
        jar tf gradle/wrapper/gradle-wrapper.jar > /dev/null
        echo "Gradle Wrapper JAR is valid and intact."

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Verify Generated APK
      run: |
        if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "ERROR: Generated APK not found at app/build/outputs/apk/debug/app-debug.apk"
          exit 1
        fi
        echo "APK build verified successfully:"
        ls -lh app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: ChromaOS-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
