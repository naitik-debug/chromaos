name: Build & Release ChromaOS APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.1.0)'
        required: false
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make Gradlew Executable
      run: chmod +x gradlew || true

    - name: Assemble Debug APK
      run: gradle assembleDebug --stacktrace || ./gradlew assembleDebug

    - name: Prepare Release Asset
      run: |
        mkdir -p release-assets
        cp app/build/outputs/apk/debug/app-debug.apk release-assets/ChromaOS-v2.1.0.apk
        ls -lh release-assets/

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChromaOS-v2.1.0-APK
        path: release-assets/ChromaOS-v2.1.0.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        name: ChromaOS v2.1.0 — Real-Time Battery, Dynamic Bluetooth & Obsidian Dark
        tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
        body_path: RELEASE_NOTES.md
        files: release-assets/ChromaOS-v2.1.0.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
