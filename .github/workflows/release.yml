name: Build & Release ChromaOS APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.1.0)'
        required: false
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate Gradle Wrapper JAR
      run: |
        echo "Validating gradle/wrapper/gradle-wrapper.jar integrity..."
        jar tf gradle/wrapper/gradle-wrapper.jar > /dev/null
        echo "Gradle Wrapper JAR is valid and intact."

    - name: Assemble Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Verify and Prepare Release Asset
      run: |
        if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "ERROR: Generated APK not found at app/build/outputs/apk/debug/app-debug.apk"
          exit 1
        fi
        mkdir -p release-assets
        cp app/build/outputs/apk/debug/app-debug.apk release-assets/ChromaOS-v2.1.0.apk
        echo "Successfully verified APK file:"
        ls -lh release-assets/ChromaOS-v2.1.0.apk

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChromaOS-v2.1.0-APK
        path: release-assets/ChromaOS-v2.1.0.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        name: ChromaOS v2.1.0 — Real-Time Battery, Dynamic Bluetooth & Obsidian Dark
        tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
        body_path: RELEASE_NOTES.md
        files: release-assets/ChromaOS-v2.1.0.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
